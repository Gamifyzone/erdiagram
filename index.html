<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ER diagram · interactive practice</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background: #1e293b;
      font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      padding: 8px;
    }
    h1 {
      font-size: 1.5rem;
      color: #f0e9e1;
      text-align: center;
      letter-spacing: 1px;
      margin-bottom: 6px;
      font-weight: 500;
      text-shadow: 0 2px 4px rgba(0,0,0,0.4);
    }
    h1 span {
      background: #fbbf24;
      color: #0f172a;
      padding: 0 12px;
      border-radius: 40px;
      font-size: 1rem;
      vertical-align: middle;
      margin-left: 10px;
      font-weight: 600;
    }
    .app {
      display: flex;
      flex: 1;
      gap: 12px;
      min-height: 0;
      flex-direction: row;
    }
    /* --- palette (left) --- */
    .palette {
      width: 130px;
      background: #334155;
      border-radius: 24px;
      padding: 12px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.5);
      overflow-y: auto;
      flex-shrink: 0;
    }
    .palette h2 {
      font-size: 0.8rem;
      color: #cbd5e1;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 4px;
      border-bottom: 1px solid #475569;
      padding-bottom: 6px;
      width: 100%;
      text-align: center;
    }
    .palette-item {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: grab;
      transition: transform 0.1s ease;
    }
    .palette-item:active {
      cursor: grabbing;
      transform: scale(0.96);
    }
    .symbol-box {
      width: 80px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f8fafc;
      border-radius: 14px;
      box-shadow: 0 4px 0 #0f172a;
      border: 2px solid #1e293b;
      font-weight: 700;
      font-size: 1.1rem;
      color: #1e293b;
      pointer-events: none;
    }
    .symbol-box.rect {
      border-radius: 8px;
      background: #a5f3fc;
      border-color: #0891b2;
    }
    .symbol-box.diamond {
      width: 70px;
      height: 70px;
      background: #fde68a;
      border-color: #b45309;
      border-radius: 20px;
      transform: rotate(45deg);
    }
    .symbol-box.diamond span {
      transform: rotate(-45deg);
      display: block;
      font-size: 1.2rem;
    }
    .symbol-box.ellipse {
      border-radius: 50%;
      width: 75px;
      height: 60px;
      background: #bbf7d0;
      border-color: #15803d;
    }
    .symbol-box.line {
      background: #cbd5e1;
      border-radius: 6px;
      font-size: 2rem;
      line-height: 1;
      color: #0f172a;
    }
    .label {
      font-size: 0.65rem;
      color: #e2e8f0;
      font-weight: 500;
      background: #1e293b;
      padding: 2px 8px;
      border-radius: 20px;
      letter-spacing: 0.3px;
    }
    /* --- canvas (right) --- */
    .canvas-wrapper {
      flex: 1;
      background: #0f172a;
      border-radius: 24px;
      overflow: hidden;
      position: relative;
      box-shadow: inset 0 0 20px #00000055, 0 8px 16px #00000066;
      border: 2px solid #475569;
      touch-action: none;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: crosshair;
      touch-action: none;
    }
    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      margin-top: 10px;
      flex-wrap: wrap;
    }
    .btn {
      background: #475569;
      border: none;
      color: #f1f5f9;
      padding: 8px 16px;
      border-radius: 40px;
      font-weight: 600;
      font-size: 0.9rem;
      letter-spacing: 0.3px;
      box-shadow: 0 3px 0 #0f172a;
      transition: 0.08s linear;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      touch-action: manipulation;
      border: 1px solid #64748b;
    }
    .btn:active {
      transform: translateY(3px);
      box-shadow: none;
    }
    .btn-primary {
      background: #fbbf24;
      color: #0f172a;
      border-color: #d97706;
      box-shadow: 0 3px 0 #b45309;
    }
    .btn-danger {
      background: #b91c1c;
      border-color: #991b1b;
      box-shadow: 0 3px 0 #7f1d1d;
    }
    .status {
      color: #cbd5e1;
      font-size: 0.8rem;
      background: #1e293b;
      padding: 6px 14px;
      border-radius: 40px;
      font-weight: 500;
      border: 1px solid #475569;
      white-space: nowrap;
    }
    /* mobile adjustments */
    @media (max-width: 700px) {
      body { padding: 4px; }
      h1 { font-size: 1.2rem; }
      h1 span { font-size: 0.8rem; padding: 0 8px; }
      .app {
        flex-direction: column;
        gap: 6px;
      }
      .palette {
        width: 100%;
        flex-direction: row;
        padding: 10px 6px;
        gap: 8px;
        overflow-x: auto;
        overflow-y: hidden;
        border-radius: 18px;
        justify-content: flex-start;
        align-items: center;
        flex-wrap: nowrap;
        min-height: 92px;
      }
      .palette h2 {
        display: none;
      }
      .palette-item {
        flex: 0 0 auto;
        width: 70px;
        gap: 4px;
      }
      .symbol-box {
        width: 60px;
        height: 48px;
        font-size: 0.9rem;
      }
      .symbol-box.diamond {
        width: 54px;
        height: 54px;
      }
      .symbol-box.ellipse {
        width: 60px;
        height: 48px;
      }
      .label {
        font-size: 0.55rem;
        padding: 2px 6px;
      }
      .toolbar {
        margin-top: 6px;
      }
      .btn {
        padding: 6px 12px;
        font-size: 0.8rem;
      }
      .status {
        font-size: 0.7rem;
        padding: 4px 10px;
      }
      .canvas-wrapper {
        border-radius: 16px;
      }
    }
  </style>
</head>
<body>
  <h1>ER diagram <span>practice</span></h1>
  <div class="app">
    <!-- palette: draggable symbols -->
    <div class="palette" id="palette">
      <h2>drag me</h2>
      <div class="palette-item" draggable="true" data-type="entity">
        <div class="symbol-box rect">Entity</div>
        <div class="label">rectangle</div>
      </div>
      <div class="palette-item" draggable="true" data-type="relation">
        <div class="symbol-box diamond"><span>◇</span></div>
        <div class="label">relation</div>
      </div>
      <div class="palette-item" draggable="true" data-type="attribute">
        <div class="symbol-box ellipse">attr</div>
        <div class="label">ellipse</div>
      </div>
      <div class="palette-item" draggable="true" data-type="line">
        <div class="symbol-box line">⟷</div>
        <div class="label">line</div>
      </div>
    </div>

    <!-- canvas area -->
    <div class="canvas-wrapper" id="canvasWrapper">
      <canvas id="erCanvas"></canvas>
    </div>
  </div>

  <!-- toolbar + status -->
  <div class="toolbar">
    <div class="status" id="statusMsg">✨ drag symbols onto canvas</div>
    <div style="display: flex; gap: 8px;">
      <button class="btn btn-danger" id="clearBtn">🗑️ clear</button>
      <button class="btn btn-primary" id="deleteBtn">❌ delete selected</button>
    </div>
  </div>

  <script>
    (function(){
      const canvas = document.getElementById('erCanvas');
      const wrapper = document.getElementById('canvasWrapper');
      const ctx = canvas.getContext('2d');
      const statusMsg = document.getElementById('statusMsg');

      // ---------- data ----------
      let nodes = [];            // { id, type, x, y, label, w, h }
      let selectedId = null;
      let nextId = 1;

      // canvas dimensions (in CSS pixels, but canvas scaled)
      let canvasWidth = 0, canvasHeight = 0;
      let dpr = window.devicePixelRatio || 1;

      // ---------- resize handler ----------
      function resizeCanvas() {
        const rect = wrapper.getBoundingClientRect();
        canvasWidth = rect.width;
        canvasHeight = rect.height;
        canvas.width = canvasWidth * dpr;
        canvas.height = canvasHeight * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        draw();
      }

      // get coordinates from touch/mouse
      function getCanvasCoords(e) {
        const rect = canvas.getBoundingClientRect();
        let clientX, clientY;
        if (e.touches) {
          clientX = e.touches[0].clientX;
          clientY = e.touches[0].clientY;
        } else {
          clientX = e.clientX;
          clientY = e.clientY;
        }
        return {
          x: clientX - rect.left,
          y: clientY - rect.top
        };
      }

      // ---------- drawing ----------
      function draw() {
        ctx.clearRect(0, 0, canvasWidth, canvasHeight);
        // grid dots (subtle)
        ctx.fillStyle = '#2a3a4e';
        for (let x = 20; x < canvasWidth; x += 30) {
          for (let y = 20; y < canvasHeight; y += 30) {
            ctx.beginPath();
            ctx.arc(x, y, 1.2, 0, 2 * Math.PI);
            ctx.fill();
          }
        }

        // draw all nodes
        nodes.forEach(node => {
          drawNode(node);
        });

        // highlight selected
        if (selectedId) {
          const sel = nodes.find(n => n.id === selectedId);
          if (sel) {
            ctx.save();
            ctx.shadowColor = '#fbbf24';
            ctx.shadowBlur = 18;
            ctx.strokeStyle = '#fbbf24';
            ctx.lineWidth = 4;
            ctx.beginPath();
            if (sel.type === 'entity') {
              ctx.roundRect(sel.x - sel.w/2, sel.y - sel.h/2, sel.w, sel.h, 8);
            } else if (sel.type === 'relation') {
              const cx = sel.x, cy = sel.y, r = sel.w/2;
              ctx.moveTo(cx, cy - r);
              ctx.lineTo(cx + r, cy);
              ctx.lineTo(cx, cy + r);
              ctx.lineTo(cx - r, cy);
              ctx.closePath();
            } else if (sel.type === 'attribute') {
              ctx.ellipse(sel.x, sel.y, sel.w/2, sel.h/2, 0, 0, Math.PI * 2);
            } else if (sel.type === 'line') {
              // for line we just draw a rounded rectangle around a small segment
              ctx.roundRect(sel.x - 20, sel.y - 8, 40, 16, 6);
            }
            ctx.stroke();
            ctx.restore();
          }
        }
      }

      // helper for rounded rect
      CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
        if (w < 2 * r) r = w / 2;
        if (h < 2 * r) r = h / 2;
        this.moveTo(x + r, y);
        this.lineTo(x + w - r, y);
        this.quadraticCurveTo(x + w, y, x + w, y + r);
        this.lineTo(x + w, y + h - r);
        this.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        this.lineTo(x + r, y + h);
        this.quadraticCurveTo(x, y + h, x, y + h - r);
        this.lineTo(x, y + r);
        this.quadraticCurveTo(x, y, x + r, y);
        return this;
      };

      function drawNode(node) {
        const { type, x, y, w, h, label } = node;
        ctx.save();
        ctx.shadowColor = '#00000040';
        ctx.shadowBlur = 8;
        ctx.shadowOffsetY = 3;

        if (type === 'entity') {
          ctx.fillStyle = '#a5f3fc';
          ctx.strokeStyle = '#0891b2';
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.roundRect(x - w/2, y - h/2, w, h, 10);
          ctx.fill();
          ctx.stroke();
          ctx.shadowColor = 'transparent';
          ctx.fillStyle = '#0f172a';
          ctx.font = 'bold 14px "Segoe UI", system-ui, sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(label || 'Entity', x, y);
        } else if (type === 'relation') {
          const r = w/2;
          ctx.fillStyle = '#fde68a';
          ctx.strokeStyle = '#b45309';
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.moveTo(x, y - r);
          ctx.lineTo(x + r, y);
          ctx.lineTo(x, y + r);
          ctx.lineTo(x - r, y);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();
          ctx.shadowColor = 'transparent';
          ctx.fillStyle = '#0f172a';
          ctx.font = 'bold 13px "Segoe UI", system-ui, sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(label || 'R', x, y);
        } else if (type === 'attribute') {
          ctx.fillStyle = '#bbf7d0';
          ctx.strokeStyle = '#15803d';
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.ellipse(x, y, w/2, h/2, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
          ctx.shadowColor = 'transparent';
          ctx.fillStyle = '#0f172a';
          ctx.font = 'bold 12px "Segoe UI", system-ui, sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(label || 'attr', x, y);
        } else if (type === 'line') {
          // line drawn as a thick dash symbol, not actual connection (for simplicity)
          ctx.shadowColor = 'transparent';
          ctx.strokeStyle = '#cbd5e1';
          ctx.lineWidth = 8;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(x - 22, y);
          ctx.lineTo(x + 22, y);
          ctx.stroke();
          // small connector dots
          ctx.fillStyle = '#94a3b8';
          ctx.beginPath();
          ctx.arc(x - 22, y, 6, 0, 2 * Math.PI);
          ctx.fill();
          ctx.beginPath();
          ctx.arc(x + 22, y, 6, 0, 2 * Math.PI);
          ctx.fill();
          ctx.font = 'bold 11px "Segoe UI", system-ui, sans-serif';
          ctx.fillStyle = '#f1f5f9';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.shadowColor = '#00000080';
          ctx.shadowBlur = 6;
          ctx.fillText('line', x, y - 18);
        }
        ctx.restore();
      }

      // ---------- add node ----------
      function addNode(type, x, y, label) {
        // clamp inside canvas
        const margin = 40;
        x = Math.min(Math.max(x, margin), canvasWidth - margin);
        y = Math.min(Math.max(y, margin), canvasHeight - margin);

        let w, h;
        if (type === 'entity') { w = 90; h = 60; label = label || 'Entity'; }
        else if (type === 'relation') { w = 70; h = 70; label = label || 'R'; }
        else if (type === 'attribute') { w = 80; h = 60; label = label || 'attr'; }
        else if (type === 'line') { w = 60; h = 30; label = 'line'; }
        else return;

        const newNode = {
          id: nextId++,
          type,
          x, y,
          w, h,
          label: label
        };
        nodes.push(newNode);
        selectedId = newNode.id;
        updateStatus(`added ${type}`);
        draw();
      }

      // ---------- selection & deletion ----------
      function getNodeAt(cx, cy) {
        // reverse iterate to pick topmost
        for (let i = nodes.length - 1; i >= 0; i--) {
          const n = nodes[i];
          if (n.type === 'entity') {
            if (cx >= n.x - n.w/2 && cx <= n.x + n.w/2 && cy >= n.y - n.h/2 && cy <= n.y + n.h/2) return n;
          } else if (n.type === 'relation') {
            const r = n.w/2;
            const dx = Math.abs(cx - n.x);
            const dy = Math.abs(cy - n.y);
            // diamond hit test (simplified)
            if (dx/(r) + dy/(r) <= 1) return n;
          } else if (n.type === 'attribute') {
            const dx = (cx - n.x) / (n.w/2);
            const dy = (cy - n.y) / (n.h/2);
            if (dx*dx + dy*dy <= 1) return n;
          } else if (n.type === 'line') {
            if (cx >= n.x - 30 && cx <= n.x + 30 && cy >= n.y - 20 && cy <= n.y + 20) return n;
          }
        }
        return null;
      }

      function deleteSelected() {
        if (selectedId === null) {
          updateStatus('⚠️ nothing selected');
          return;
        }
        nodes = nodes.filter(n => n.id !== selectedId);
        selectedId = null;
        draw();
        updateStatus('deleted');
      }

      function updateStatus(msg) {
        statusMsg.textContent = '✨ ' + msg;
        setTimeout(() => {
          if (statusMsg.textContent.includes(msg)) {
            statusMsg.textContent = '✨ drag symbols onto canvas';
          }
        }, 1500);
      }

      // ---------- drag & drop from palette ----------
      const paletteItems = document.querySelectorAll('.palette-item');
      paletteItems.forEach(item => {
        item.addEventListener('dragstart', (e) => {
          e.dataTransfer.setData('text/plain', item.dataset.type);
          e.dataTransfer.effectAllowed = 'copy';
        });
        // mobile: touch drag implementation
        item.addEventListener('touchstart', (e) => {
          e.preventDefault();
          const type = item.dataset.type;
          // create ghost element? We'll just use a flag and move on touchend
          item.dataset.touchDrag = type;
        }, { passive: false });
      });

      // desktop drag over canvas
      canvas.addEventListener('dragover', (e) => {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'copy';
      });

      canvas.addEventListener('drop', (e) => {
        e.preventDefault();
        const type = e.dataTransfer.getData('text/plain');
        if (!type) return;
        const { x, y } = getCanvasCoords(e);
        addNode(type, x, y);
      });

      // mobile touch drop (global touchend on canvas wrapper)
      let touchDragType = null;

      // listen for touchstart on palette items
      document.querySelectorAll('.palette-item').forEach(item => {
        item.addEventListener('touchstart', (e) => {
          e.preventDefault();
          touchDragType = item.dataset.type;
          // optional feedback
          item.style.opacity = '0.6';
        }, { passive: false });
      });

      // cancel touch drag on end anywhere
      document.addEventListener('touchend', (e) => {
        // reset palette opacity
        document.querySelectorAll('.palette-item').forEach(i => i.style.opacity = '1');
        if (!touchDragType) return;
        // only if touch was on canvas area? we can check if touch was dropped inside wrapper
        const touch = e.changedTouches[0];
        if (touch) {
          const rect = wrapper.getBoundingClientRect();
          const clientX = touch.clientX;
          const clientY = touch.clientY;
          if (clientX >= rect.left && clientX <= rect.right && clientY >= rect.top && clientY <= rect.bottom) {
            // inside canvas wrapper
            const x = clientX - rect.left;
            const y = clientY - rect.top;
            addNode(touchDragType, x, y);
          }
        }
        touchDragType = null;
      });

      document.addEventListener('touchcancel', () => {
        document.querySelectorAll('.palette-item').forEach(i => i.style.opacity = '1');
        touchDragType = null;
      });

      // ---------- canvas interactions: select / move ----------
      let isDraggingNode = false;
      let dragStartX = 0, dragStartY = 0;
      let nodeStartX = 0, nodeStartY = 0;

      function onPointerDown(e) {
        // prevent default to avoid scrolling on touch
        e.preventDefault();

        const { x, y } = getCanvasCoords(e);
        const hitNode = getNodeAt(x, y);

        if (hitNode) {
          selectedId = hitNode.id;
          isDraggingNode = true;
          dragStartX = x;
          dragStartY = y;
          nodeStartX = hitNode.x;
          nodeStartY = hitNode.y;
          draw();
        } else {
          // click on empty area:
