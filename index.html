<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ER diagram · interactive builder</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background: #0b0f17;
      font-family: 'Inter', 'Segoe UI', Roboto, system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      padding: 10px;
      color: #e2e8f0;
    }
    .app-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      padding: 0 4px;
    }
    .app-header h1 {
      font-size: 1.4rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #a5f3fc 0%, #fbbf24 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .header-badge {
      background: #1e293b;
      padding: 5px 12px;
      border-radius: 40px;
      font-size: 0.75rem;
      font-weight: 500;
      border: 1px solid #334155;
      color: #94a3b8;
    }
    .main-grid {
      display: flex;
      flex: 1;
      gap: 12px;
      min-height: 0;
      flex-direction: row;
    }
    /* ----- left palette (desktop) ----- */
    .tool-palette {
      width: 150px;
      background: #111827;
      border-radius: 20px;
      padding: 12px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      border: 1px solid #1f2a3f;
      overflow-y: auto;
      flex-shrink: 0;
    }
    .palette-section {
      width: 100%;
    }
    .palette-section h3 {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #64748b;
      margin-bottom: 8px;
      font-weight: 600;
      text-align: center;
    }
    .tool-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      border-radius: 12px;
      cursor: grab;
      transition: background 0.12s ease;
      border: 1px solid transparent;
      margin-bottom: 4px;
    }
    .tool-item:hover {
      background: #1e293b;
      border-color: #334155;
    }
    .tool-item:active {
      cursor: grabbing;
      background: #263449;
    }
    .tool-icon {
      width: 42px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.8rem;
      flex-shrink: 0;
      border: 2px solid;
    }
    .icon-entity {
      background: #1e3a5f;
      border-color: #3b82f6;
      color: #93c5fd;
    }
    .icon-relation {
      background: #3f2e1b;
      border-color: #f59e0b;
      color: #fcd34d;
      border-radius: 10px;
      transform: rotate(45deg);
      width: 34px;
      height: 34px;
      margin: 0 4px;
    }
    .icon-relation span {
      transform: rotate(-45deg);
      font-size: 1rem;
    }
    .icon-attribute {
      background: #1a3a2a;
      border-color: #22c55e;
      color: #86efac;
      border-radius: 50%;
      width: 42px;
      height: 34px;
    }
    .icon-line {
      background: #1e293b;
      border-color: #64748b;
      color: #94a3b8;
      font-size: 1.1rem;
    }
    .tool-label {
      font-size: 0.7rem;
      font-weight: 500;
      color: #cbd5e1;
      white-space: nowrap;
    }
    /* ----- canvas area ----- */
    .canvas-container {
      flex: 1;
      background: #0a0e14;
      border-radius: 20px;
      overflow: hidden;
      position: relative;
      border: 1px solid #1f2a3f;
      box-shadow: inset 0 0 30px #00000080;
      touch-action: none;
      min-width: 0;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      cursor: crosshair;
    }
    /* floating toolbar */
    .floating-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
      flex-wrap: wrap;
    }
    .action-btns {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .btn {
      background: #1e293b;
      border: 1px solid #334155;
      color: #e2e8f0;
      padding: 8px 18px;
      border-radius: 40px;
      font-weight: 600;
      font-size: 0.8rem;
      letter-spacing: 0.01em;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: 0.1s ease;
      touch-action: manipulation;
      font-family: inherit;
    }
    .btn:hover {
      background: #263449;
      border-color: #475569;
    }
    .btn:active {
      transform: scale(0.97);
    }
    .btn-accent {
      background: #fbbf24;
      color: #0b0f17;
      border-color: #fbbf24;
      font-weight: 700;
    }
    .btn-accent:hover {
      background: #fcd34d;
    }
    .btn-danger {
      background: #7f1d1d;
      border-color: #b91c1c;
      color: #fecaca;
    }
    .btn-danger:hover {
      background: #991b1b;
    }
    .status-chip {
      font-size: 0.75rem;
      padding: 6px 14px;
      background: #111827;
      border-radius: 40px;
      border: 1px solid #1f2a3f;
      color: #94a3b8;
      font-weight: 500;
      white-space: nowrap;
    }
    .status-chip span {
      color: #fbbf24;
      font-weight: 600;
    }

    /* mobile layout */
    @media (max-width: 750px) {
      body { padding: 6px; }
      .app-header h1 { font-size: 1.1rem; }
      .main-grid {
        flex-direction: column;
        gap: 6px;
      }
      .tool-palette {
        width: 100%;
        flex-direction: row;
        overflow-x: auto;
        overflow-y: hidden;
        padding: 8px 6px;
        gap: 6px;
        border-radius: 16px;
        min-height: 80px;
        align-items: center;
        flex-wrap: nowrap;
        justify-content: flex-start;
      }
      .palette-section {
        display: flex;
        gap: 6px;
        align-items: center;
        flex: 0 0 auto;
      }
      .palette-section h3 {
        display: none;
      }
      .tool-item {
        flex: 0 0 auto;
        padding: 4px 6px;
        margin-bottom: 0;
        gap: 5px;
      }
      .tool-icon {
        width: 36px;
        height: 30px;
        font-size: 0.7rem;
      }
      .icon-relation {
        width: 30px;
        height: 30px;
      }
      .tool-label {
        font-size: 0.6rem;
      }
      .btn {
        padding: 6px 14px;
        font-size: 0.75rem;
      }
      .status-chip {
        font-size: 0.65rem;
        padding: 4px 10px;
      }
      .canvas-container {
        border-radius: 16px;
      }
      .floating-toolbar {
        margin-top: 6px;
      }
    }
  </style>
</head>
<body>
  <div class="app-header">
    <h1>ER Diagram <span style="font-weight:300; opacity:0.7;">practice</span></h1>
    <div class="header-badge">drag · drop · connect</div>
  </div>

  <div class="main-grid">
    <!-- palette -->
    <div class="tool-palette" id="palette">
      <div class="palette-section">
        <h3>entities</h3>
        <div class="tool-item" draggable="true" data-type="entity">
          <div class="tool-icon icon-entity">E</div>
          <span class="tool-label">Entity</span>
        </div>
      </div>
      <div class="palette-section">
        <h3>relations</h3>
        <div class="tool-item" draggable="true" data-type="relation">
          <div class="tool-icon icon-relation"><span>◇</span></div>
          <span class="tool-label">Relation</span>
        </div>
      </div>
      <div class="palette-section">
        <h3>attributes</h3>
        <div class="tool-item" draggable="true" data-type="attribute">
          <div class="tool-icon icon-attribute">A</div>
          <span class="tool-label">Attribute</span>
        </div>
      </div>
      <div class="palette-section">
        <h3>connectors</h3>
        <div class="tool-item" draggable="true" data-type="line">
          <div class="tool-icon icon-line">⟷</div>
          <span class="tool-label">Line</span>
        </div>
      </div>
    </div>

    <!-- canvas -->
    <div class="canvas-container" id="canvasContainer">
      <canvas id="erCanvas"></canvas>
    </div>
  </div>

  <!-- toolbar -->
  <div class="floating-toolbar">
    <div class="status-chip" id="statusMsg"><span>ready</span> · drag symbols</div>
    <div class="action-btns">
      <button class="btn btn-danger" id="clearBtn">🗑️ Clear all</button>
      <button class="btn" id="deleteBtn">❌ Delete selected</button>
      <button class="btn btn-accent" id="connectBtn">🔗 Connect</button>
    </div>
  </div>

  <script>
    (function(){
      const canvas = document.getElementById('erCanvas');
      const container = document.getElementById('canvasContainer');
      const ctx = canvas.getContext('2d');
      const statusMsg = document.getElementById('statusMsg');

      // ---------- state ----------
      let nodes = [];                 // { id, type, x, y, w, h, label }
      let connections = [];           // { fromId, toId }
      let selectedId = null;
      let connectMode = false;
      let connectSourceId = null;
      let nextId = 1;

      let canvasWidth = 0, canvasHeight = 0;
      const dpr = window.devicePixelRatio || 1;

      // ---------- resize ----------
      function resizeCanvas() {
        const rect = container.getBoundingClientRect();
        canvasWidth = rect.width;
        canvasHeight = rect.height;
        canvas.width = canvasWidth * dpr;
        canvas.height = canvasHeight * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        draw();
      }

      // get coords from event
      function getCoords(e) {
        const rect = canvas.getBoundingClientRect();
        let cx, cy;
        if (e.touches) {
          cx = e.touches[0].clientX;
          cy = e.touches[0].clientY;
        } else {
          cx = e.clientX;
          cy = e.clientY;
        }
        return { x: cx - rect.left, y: cy - rect.top };
      }

      // ---------- drawing ----------
      function draw() {
        ctx.clearRect(0, 0, canvasWidth, canvasHeight);

        // subtle grid
        ctx.fillStyle = '#151e2b';
        for (let x = 30; x < canvasWidth; x += 40) {
          for (let y = 30; y < canvasHeight; y += 40) {
            ctx.beginPath();
            ctx.arc(x, y, 1.5, 0, 2 * Math.PI);
            ctx.fill();
          }
        }

        // draw connections first (behind nodes)
        connections.forEach(conn => {
          const from = nodes.find(n => n.id === conn.fromId);
          const to = nodes.find(n => n.id === conn.toId);
          if (!from || !to) return;
          ctx.beginPath();
          ctx.strokeStyle = '#475569';
          ctx.lineWidth = 3;
          ctx.setLineDash([]);
          ctx.moveTo(from.x, from.y);
          ctx.lineTo(to.x, to.y);
          ctx.stroke();
          // arrow dot at midpoint
          const mx = (from.x + to.x) / 2;
          const my = (from.y + to.y) / 2;
          ctx.fillStyle = '#64748b';
          ctx.beginPath();
          ctx.arc(mx, my, 3, 0, 2 * Math.PI);
          ctx.fill();
        });

        // draw nodes
        nodes.forEach(node => drawNode(node));

        // highlight selected
        if (selectedId) {
          const sel = nodes.find(n => n.id === selectedId);
          if (sel) {
            ctx.save();
            ctx.shadowColor = '#fbbf24';
            ctx.shadowBlur = 20;
            ctx.strokeStyle = '#fbbf24';
            ctx.lineWidth = 4;
            ctx.beginPath();
            if (sel.type === 'entity') {
              ctx.roundRect(sel.x - sel.w/2 - 2, sel.y - sel.h/2 - 2, sel.w + 4, sel.h + 4, 10);
            } else if (sel.type === 'relation') {
              const r = sel.w/2 + 4;
              ctx.moveTo(sel.x, sel.y - r);
              ctx.lineTo(sel.x + r, sel.y);
              ctx.lineTo(sel.x, sel.y + r);
              ctx.lineTo(sel.x - r, sel.y);
              ctx.closePath();
            } else if (sel.type === 'attribute') {
              ctx.ellipse(sel.x, sel.y, sel.w/2 + 3, sel.h/2 + 3, 0, 0, Math.PI * 2);
            } else if (sel.type === 'line') {
              ctx.roundRect(sel.x - 26, sel.y - 14, 52, 28, 8);
            }
            ctx.stroke();
            ctx.restore();
          }
        }

        // connect mode visual cue
        if (connectMode && connectSourceId) {
          const src = nodes.find(n => n.id === connectSourceId);
          if (src) {
            ctx.save();
            ctx.strokeStyle = '#fbbf24';
            ctx.lineWidth = 3;
            ctx.setLineDash([6, 6]);
            ctx.beginPath();
            ctx.arc(src.x, src.y, Math.max(src.w, src.h)/2 + 8, 0, 2 * Math.PI);
            ctx.stroke();
            ctx.restore();
          }
        }
      }

      // rounded rect helper
      CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
        if (w < 2 * r) r = w / 2;
        if (h < 2 * r) r = h / 2;
        this.moveTo(x + r, y);
        this.lineTo(x + w - r, y);
        this.quadraticCurveTo(x + w, y, x + w, y + r);
        this.lineTo(x + w, y + h - r);
        this.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        this.lineTo(x + r, y + h);
        this.quadraticCurveTo(x, y + h, x, y + h - r);
        this.lineTo(x, y + r);
        this.quadraticCurveTo(x, y, x + r, y);
        return this;
      };

      function drawNode(node) {
        const { type, x, y, w, h, label } = node;
        ctx.save();
        ctx.shadowColor = '#00000060';
        ctx.shadowBlur = 10;
        ctx.shadowOffsetY = 4;

        if (type === 'entity') {
          ctx.fillStyle = '#1e3a5f';
          ctx.strokeStyle = '#3b82f6';
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.roundRect(x - w/2, y - h/2, w, h, 10);
          ctx.fill();
          ctx.stroke();
          ctx.shadowColor = 'transparent';
          ctx.fillStyle = '#dbeafe';
          ctx.font = 'bold 13px "Inter", system-ui, sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(label || 'Entity', x, y);
        } else if (type === 'relation') {
          const r = w/2;
          ctx.fillStyle = '#3f2e1b';
          ctx.strokeStyle = '#f59e0b';
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.moveTo(x, y - r);
          ctx.lineTo(x + r, y);
          ctx.lineTo(x, y + r);
          ctx.lineTo(x - r, y);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();
          ctx.shadowColor = 'transparent';
          ctx.fillStyle = '#fef3c7';
          ctx.font = 'bold 12px "Inter", system-ui, sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(label || 'R', x, y);
        } else if (type === 'attribute') {
          ctx.fillStyle = '#1a3a2a';
          ctx.strokeStyle = '#22c55e';
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.ellipse(x, y, w/2, h/2, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
          ctx.shadowColor = 'transparent';
          ctx.fillStyle = '#dcfce7';
          ctx.font = 'bold 12px "Inter", system-ui, sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(label || 'attr', x, y);
        } else if (type === 'line') {
          ctx.shadowColor = 'transparent';
          ctx.strokeStyle = '#64748b';
          ctx.lineWidth = 5;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(x - 22, y);
          ctx.lineTo(x + 22, y);
          ctx.stroke();
          ctx.fillStyle = '#94a3b8';
          ctx.beginPath();
          ctx.arc(x - 22, y, 7, 0, 2 * Math.PI);
          ctx.fill();
          ctx.beginPath();
          ctx.arc(x + 22, y, 7, 0, 2 * Math.PI);
          ctx.fill();
          ctx.font = 'bold 10px "Inter", system-ui, sans-serif';
          ctx.fillStyle = '#cbd5e1';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText('line', x, y - 18);
        }
        ctx.restore();
      }

      // ---------- node CRUD ----------
      function addNode(type, x, y, label) {
        const margin = 45;
        x = Math.min(Math.max(x, margin), canvasWidth - margin);
        y = Math.min(Math.max(y, margin), canvasHeight - margin);

        let w, h;
        if (type === 'entity') { w = 100; h = 60; label = label || 'Entity'; }
        else if (type === 'relation') { w = 75; h = 75; label = label || 'R'; }
        else if (type === 'attribute') { w = 85; h = 60; label = label || 'attr'; }
        else if (type === 'line') { w = 60; h = 30; label = 'line'; }
        else return;

        const newNode = {
          id: nextId++,
          type,
          x, y,
          w, h,
          label: label
        };
        nodes.push(newNode);
        selectedId = newNode.id;
        connectSourceId = null;
        updateStatus(`added ${type}`);
        draw();
      }

      function deleteSelected() {
        if (selectedId === null) {
          updateStatus('nothing selected');
          return;
        }
        nodes = nodes.filter(n => n.id !== selectedId);
        connections = connections.filter(c => c.fromId !== selectedId && c.toId !== selectedId);
        selectedId = null;
        connectSourceId = null;
        draw();
        updateStatus('deleted node');
      }

      function clearAll() {
        if (nodes.length === 0 && connections.length === 0) return;
        if (confirm('Clear entire diagram?')) {
          nodes = [];
          connections = [];
          selectedId = null;
          connectSourceId = null;
          draw();
          updateStatus('canvas cleared');
        }
      }

      function updateStatus(msg) {
        statusMsg.innerHTML = `<span>${msg}</span> · drag symbols`;
        clearTimeout(window._statusTimer);
        window._statusTimer = setTimeout(() => {
          statusMsg.innerHTML = `<span>ready</span> · drag symbols`;
        }, 1600);
      }

      // ---------- hit testing ----------
      function getNodeAt(cx, cy) {
        for (let i = nodes.length - 1; i >= 0; i--) {
          const n = nodes[i];
          if (n.type === 'entity') {
            if (cx >= n.x - n.w/2 && cx <= n.x + n.w/2 && cy >= n.y - n.h/2 && cy <= n.y + n.h/2) return n;
          } else if (n.type === 'relation') {
            const r = n.w/2;
            const dx = Math.abs(cx - n.x);
            const dy = Math.abs(cy - n.y);
            if (dx + dy <= r) return n;
          } else if (n.type === 'attribute') {
            const dx = (cx - n.x) / (n.w/2);
            const dy = (cy - n.y) / (n.h/2);
            if (dx*dx + dy*dy <= 1) return n;
          } else if (n.type === 'line') {
            if (cx >= n.x - 30 && cx <= n.x + 30 && cy >= n.y - 20 && cy <= n.y + 20) return n;
          }
        }
        return null;
      }

      // ---------- connect mode logic ----------
      function toggleConnectMode() {
        if (connectMode) {
          // cancel
          connectMode = false;
          connectSourceId = null;
          document.getElementById('connectBtn').style.background = '';
          document.getElementById('connectBtn').style.color = '';
          updateStatus('connect cancelled');
          draw();
          return;
        }
        connectMode = true;
        connectSourceId = null;
        document.getElementById('connectBtn').style.background = '#fbbf24';
        document.getElementById('connectBtn').style.color = '#0b0f17';
        updateStatus('select source node');
        draw();
      }

      // ---------- drag & drop from palette ----------
      document.querySelectorAll('.tool-item').forEach(item => {
        item.addEventListener('dragstart', (e) => {
          e.dataTransfer.setData('text/plain'
